[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedmed"
version = "1.0.0"
description = "FedMed privacy-preserving federated medical image segmentation"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flwr[dp]==1.35.0",
    "torch",
    "monai",
    "numpy",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = [
    "clients",
    "server",
    "model",
    "training",
    "evaluation",
    "security",
]

[tool.flwr.app]
publisher = "FedMed"

[tool.flwr.app.components]
serverapp = "server.server_app:app"
clientapp = "clients.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
local-epochs = 1
learning-rate = 0.001
dp-noise-multiplier = 1.0
dp-clipping-norm = 2.5
num-sampled-clients = 3