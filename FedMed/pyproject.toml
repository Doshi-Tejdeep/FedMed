[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedmed"
version = "1.0.0"
description = "FedMed privacy-preserving federated medical image segmentation"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flwr[dp,simulation]==1.35.0",
    "torch==2.14.0",
    "monai==1.6.0",
    "numpy==2.5.3",
    "matplotlib==3.11.1",
    "nibabel==5.4.2",
    "pandas==3.0.5",
    "streamlit==1.62.0",
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "clients",
    "server",
    "model",
    "training",
    "evaluation",
    "security",
]

[tool.flwr.app]
publisher = "FedMed"

[tool.flwr.app.components]
serverapp = "server.server_app:app"
clientapp = "clients.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
local-epochs = 1
learning-rate = 0.001
dp-noise-multiplier = 0.5
dp-clipping-norm = 2.5
num-sampled-clients = 3